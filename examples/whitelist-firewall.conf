# modulejail whitelist: netfilter / firewall toolkit
#
# The same keep-set as the built-in `firewall` profile (-p firewall =
# conservative + this list). Use this file when the firewall profile does not
# fit, for example a laptop/workstation that also runs a firewall: pick
# `-p desktop` for the peripherals and add this file for the netfilter modules
# (profiles are not cumulative, so you cannot select desktop AND firewall).
#
# Why: netfilter match/target/helper modules autoload on demand when an
# iptables/nftables/ipset rule first references them. If the full rule set is
# not active when modulejail runs, those modules look unused and get
# blacklisted, and a later rule fails to load them (gh #16). Keeping the whole
# toolkit prevents that. Marginal attack surface is low: these modules are
# reachable only by a process holding CAP_NET_ADMIN.
#
# Install by merging into the default whitelist file:
#
#   cat examples/whitelist-firewall.conf >> /etc/modulejail/whitelist.conf
#   modulejail -p desktop            # auto-detects the default whitelist path
#
# or pointing at it explicitly for one run:
#
#   modulejail -p desktop --whitelist-file examples/whitelist-firewall.conf
#
# One module per line, '#' starts a comment. Trim to what your ruleset uses
# (`lsmod` with the firewall fully up shows the live set) if you would rather
# keep less than the whole subsystem.

